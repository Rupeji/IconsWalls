name: Actualizar Galería de Wallpapers

on:
  push:
    paths:
      - 'Wallpapers/**' # Cambia esto por el nombre exacto de tu carpeta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar lista de imágenes en el README
        run: |
          echo "# Mis Wallpapers" > README.md
          echo "" >> README.md
          echo "<table>" >> README.md
          
          shopt -s nocaseglob
          count=0
          for img in Wallpapers/*.{jpg,jpeg,png,webp}; do
            [ -e "$img" ] || continue
            
            if [ $((count % 3)) -eq 0 ]; then
              echo "  <tr>" >> README.md
            fi
            
            printf '    <td align="center"><img src="%s" width="100%%"></td>\n' "$img" >> README.md
            count=$((count + 1))
            
            if [ $((count % 3)) -eq 0 ]; then
              echo "  </tr>" >> README.md
            fi
          done
          
          # Cerrar la fila si el total de imágenes no es múltiplo de 3
          if [ $((count % 3)) -ne 0 ]; then
            echo "  </tr>" >> README.md
          fi
          
          echo "</table>" >> README.md

      - name: Guardar cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualiza galería de wallpapers" && git push)

